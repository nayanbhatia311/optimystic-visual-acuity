name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Audit public release contents
        run: ./scripts/audit_public_release.sh
      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project VisualAcuity.xcodeproj \
            -scheme VisualAcuity \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
